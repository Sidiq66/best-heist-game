<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilt &amp; Gone — a three-vault heist</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0d12; }
  body { display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
  #game { width: min(1024px, 100%); height: auto; display: block; background: #101219; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1024" height="704" aria-label="Gilt and Gone: sneak through three bank vaults, dodge guard and camera vision cones, grab the prize and escape before the alarm fills"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
